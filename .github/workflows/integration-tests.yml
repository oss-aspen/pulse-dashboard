name: Integration Tests

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Test Suites
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect current OSAIPO suites
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="HEAD^"
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$CHANGED"
          MODULES='[]'

          add_module() {
            MODULES=$(jq -c --arg name "$1" '. + [$name] | unique' <<<"$MODULES")
          }

          if grep -qE '^(tests/integration/((constants|helpers)\.js|people-teams\.spec\.js)|platform/(allocation|jira-taxonomy)/|modules/team-tracker/)' <<<"$CHANGED"; then
            add_module people-teams
          fi
          if grep -qE '^(platform/about-tabs/|tests/integration/about-tabs\.spec\.js)' <<<"$CHANGED"; then
            add_module about-tabs
          fi
          if grep -qE '^(modules/upstream-pulse/|tests/integration/upstream-pulse\.spec\.js)' <<<"$CHANGED"; then
            add_module upstream-pulse
          fi
          if grep -qE '^(platform/|modules/.*/|tests/integration/sotu-dashboard\.spec\.js|tests/integration/(constants|helpers)\.js)' <<<"$CHANGED"; then
            add_module sotu-dashboard
          fi

          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Selected suites: $MODULES"

  run-tests:
    name: Test ${{ matrix.module }}
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-org-pulse-module
        with:
          module: ${{ matrix.module }}

  integration-test-status:
    name: Integration Test Status
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, run-tests]
    steps:
      - name: Evaluate results
        run: |
          MODULES='${{ needs.detect-changes.outputs.modules }}'
          if [ "$MODULES" = "[]" ]; then
            echo "No current OSAIPO integration suite changes"
          elif [ "${{ needs.run-tests.result }}" != "success" ]; then
            echo "Integration tests failed or were cancelled"
            exit 1
          else
            echo "All selected integration suites passed"
          fi
