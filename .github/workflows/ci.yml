name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="origin/main"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "::error::BASE_SHA is empty — cannot detect changes"
            exit 1
          fi

          CHANGED=$(git diff --name-only ${BASE_SHA} HEAD)
          # App/build inputs: anything that changes what we build or test.
          # Includes the eng Dockerfiles (they build the app images, so
          # Dockerfile-only PRs get the full test + smoke + dockerfile-deps
          # validation instead of kustomize-only checks).
          if echo "$CHANGED" | grep -qE '^(server/index\.js|modules/|platform/|app/|scripts/|eslint\.config|eslint-rules/|fixtures/|package|vite\.config|tailwind\.config|postcss\.config|vitest\.config|vitest\.setup|index\.html|public/|tests/|playwright\.config|Makefile|deploy/osaipo-eng\.[^/]*\.Dockerfile|\.github/workflows/ci\.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^deploy/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.deploy == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.detect-changes.outputs.app == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Socket Security
        if: needs.detect-changes.outputs.app == 'true'
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        if: needs.detect-changes.outputs.app == 'true'
        run: |
          if command -v sfw &> /dev/null; then
            sfw npm ci
          else
            echo "::warning::Socket firewall not available, falling back to plain npm ci"
            npm ci
          fi

      - name: Setup workspace
        if: needs.detect-changes.outputs.app == 'true'
        run: npm run setup

      # Blocks only vulnerabilities introduced by this PR's dependency
      # changes (base vs head lockfile diff) — not pre-existing advisories.
      # This replaces the old `npm audit` gate, which scanned the whole
      # lockfile and failed PRs on pre-existing advisories before
      # lint/test/build could run. Continuous monitoring of existing debt
      # is Dependabot's job (alerts + weekly version updates).
      - name: Review dependency changes
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.app == 'true'
        uses: actions/dependency-review-action@v5

      - name: Validate module manifests
        if: needs.detect-changes.outputs.app == 'true'
        run: npm run validate:modules

      - name: Validate platform manifests
        if: needs.detect-changes.outputs.app == 'true'
        run: npm run validate:platform

      - name: Run linting
        if: needs.detect-changes.outputs.app == 'true'
        run: npm run lint

      - name: Run tests
        if: needs.detect-changes.outputs.app == 'true'
        run: npm test

      - name: Validate OpenAPI spec
        if: needs.detect-changes.outputs.app == 'true'
        run: npm run validate:openapi

      - name: Validate Dockerfile dependencies
        if: needs.detect-changes.outputs.app == 'true'
        run: npm run validate:dockerfile-deps

      - name: Build
        if: needs.detect-changes.outputs.app == 'true'
        run: npm run build

      - name: Install kustomize
        if: needs.detect-changes.outputs.deploy == 'true'
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: '5.8.1'

      - name: Validate kustomize overlays
        if: needs.detect-changes.outputs.deploy == 'true'
        run: |
          for overlay in deploy/openshift/overlays/*/; do
            name=$(basename "$overlay")
            echo "=== Validating overlay: $name ==="
            kustomize build "$overlay" > /dev/null
          done

  smoke-test-osaipo-eng:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    permissions:
      contents: read
    env:
      CONTAINER_RUNTIME: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and setup workspace
        run: npm ci && npm run setup

      - name: Pull or build core images and build OSAIPO images
        shell: bash
        run: |
          ./scripts/pull-or-build-core-images.sh
          make build-backend-image
          make build-frontend-image

      - name: Run smoke tests
        run: make smoke-test

  # Single aggregate gate for this workflow and the only check that needs
  # to be required in branch protection ("CI"). It always reports a result
  # even when the path-filtered jobs are skipped, which is why the per-job
  # no-op twin pattern is not needed here.
  smoke-test-status:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, test, smoke-test-osaipo-eng]
    permissions:
      contents: read
    steps:
      - name: Evaluate CI results
        run: |
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "::error::Change detection failed — cannot evaluate results"
            exit 1
          fi

          APP="${{ needs.detect-changes.outputs.app }}"
          DEPLOY="${{ needs.detect-changes.outputs.deploy }}"
          TEST="${{ needs.test.result }}"
          SMOKE="${{ needs.smoke-test-osaipo-eng.result }}"

          FAILED=false

          # "Lint, Test & Build" runs for app or deploy changes; gate on its
          # result in both cases (previously deploy-only kustomize failures
          # slipped through this check).
          if { [ "$APP" = "true" ] || [ "$DEPLOY" = "true" ]; } && [ "$TEST" != "success" ]; then
            echo "::error::Lint, Test & Build failed (result: $TEST)"
            FAILED=true
          fi

          if [ "$APP" = "true" ] && [ "$SMOKE" != "success" ]; then
            echo "::error::Smoke tests failed (result: $SMOKE)"
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

          echo "All checks passed"
