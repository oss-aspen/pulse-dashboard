name: Core Upgrade

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check for new core version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(npm view @org-pulse/core version)
          CURRENT=$(node -p "require('./package.json').dependencies['@org-pulse/core'].replace(/^\^/, '')")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "needs_upgrade=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_upgrade=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upgrade core dependency and deployment base
        if: steps.check.outputs.needs_upgrade == 'true'
        run: |
          npm install @org-pulse/core@${{ steps.check.outputs.latest }}
          scripts/sync-osaipo-core-base.sh "${{ steps.check.outputs.latest }}"

      - name: Validate deployment base
        if: steps.check.outputs.needs_upgrade == 'true'
        run: |
          npx --yes kustomize build deploy/openshift/overlays/osaipo-eng-prod >/dev/null
          npm run validate:dockerfile-deps

      - uses: peter-evans/create-pull-request@v8
        if: steps.check.outputs.needs_upgrade == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): upgrade @org-pulse/core to v${{ steps.check.outputs.latest }}'
          title: 'chore(deps): upgrade @org-pulse/core to v${{ steps.check.outputs.latest }}'
          body: |
            Automated OSAIPO core upgrade from `v${{ steps.check.outputs.current }}` to `v${{ steps.check.outputs.latest }}`.

            This updates both the npm dependency and the vendored OSAIPO-owned deployment base.
          branch: chore/core-upgrade-v${{ steps.check.outputs.latest }}
