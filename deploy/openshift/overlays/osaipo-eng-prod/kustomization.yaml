apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: osaipo-aspen--pulse-dashboard

resources:
- ../osaipo-eng

  # Roster push target for the upstream-pulse module: it POSTs people with
  # GitHub usernames to /api/admin/team-members/sync (source: org_pulse_roster)
  # and proxies metrics reads from there. In-cluster service URL; the
  # Upstream Pulse NetworkPolicy admits these pods on port 3000.
configMapGenerator:
- behavior: merge
  literals:
  - API_PUBLIC_URL=https://api-pulse-dashboard.apps.int.spoke.prod.us-east-1.aws.paas.redhat.com
  - AUTH_EMAIL_DOMAIN=cluster.local
  - UPSTREAM_PULSE_API_URL=http://backend.osaipo-aspen--upstream-pulse.svc.cluster.local:3000
  name: team-tracker-config

patches:
- path: route-patch.yaml
- path: api-route-patch.yaml
- path: storage-patch.yaml

images:
- name: quay.io/osaipo-data/osaipo-pulse-backend
  newTag: b7955bef2f4a33b9be276350819fa5e2e18b9308
- name: quay.io/osaipo-data/osaipo-pulse-frontend
  newTag: b7955bef2f4a33b9be276350819fa5e2e18b9308
